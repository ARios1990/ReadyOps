name: Apply Client Lead Recording

on:
  push:
    branches: [feature/client-lead-template-recording]
    paths:
      - 'scripts/apply-client-lead-recording.py'
      - 'src/QCRecordingUpload.tsx'
      - 'src/ClientLeadTemplate.tsx'
      - 'src/SharedRecordingPlayer.tsx'
      - 'supabase/functions/shared-recording-url/index.ts'
      - 'supabase/migrations/20260817195500_private_qc_recordings_storage.sql'
      - '.github/workflows/apply-client-lead-recording.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-lead-template-recording
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python scripts/apply-client-lead-recording.py
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CompanyPortal.tsx src/QCQueue.tsx src/portalUtils.ts
          git commit -m "Wire recording upload and client lead template"
          git push origin HEAD:feature/client-lead-template-recording
