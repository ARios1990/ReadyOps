name: Apply Admin Operations Home
on:
  push:
    branches: [feature/admin-ops-home-v2]
    paths:
      - 'scripts/apply-admin-ops-home.mjs'
      - '.github/workflows/apply-admin-ops-home.yml'
      - '.github/admin-ops-home-trigger'
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/admin-ops-home-v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/apply-admin-ops-home.mjs
      - run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/Dashboard.tsx src/App.tsx
          git diff --cached --quiet || git commit -m "Integrate operations-first admin home"
          git push origin HEAD:feature/admin-ops-home-v2
