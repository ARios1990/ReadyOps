name: Fix QC CI
on:
  push:
    branches: [feature/qc-operations]
    paths: [scripts/fix-qc-ci.mjs]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qc-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-qc-ci.mjs
      - run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/CompanyPortal.tsx
          git rm scripts/fix-qc-ci.mjs .github/workflows/fix-qc-ci.yml
          git commit -m "Fix company outcome note expression"
          git push origin HEAD:feature/qc-operations
