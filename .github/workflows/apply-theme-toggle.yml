name: Apply Theme Toggle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-theme-toggle.py'
      - '.github/workflows/apply-theme-toggle.yml'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply theme toggle
        run: python scripts/apply-theme-toggle.py
      - name: Commit generated changes
        run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/Dashboard.tsx
          git diff --cached --quiet || git commit -m "Add theme toggle to dashboard top bar"
          git push origin HEAD:main
