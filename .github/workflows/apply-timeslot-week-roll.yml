name: Apply Time Slots Week Roll

on:
  push:
    branches: [feature/auto-roll-timeslot-week]
    paths:
      - 'scripts/apply-timeslot-week-roll.mjs'
      - '.github/workflows/apply-timeslot-week-roll.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-roll-timeslot-week
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-timeslot-week-roll.mjs
      - run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-roll Time Slots week dates"
            git push
          fi
