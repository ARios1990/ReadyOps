name: Apply Recording and Branding

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-recording-branding.py'
      - 'scripts/apply-recording-branding-v2.py'
      - 'scripts/fix-recording-branding-types.py'
      - '.github/workflows/apply-recording-branding.yml'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply recording and branding TypeScript fixes
        run: python scripts/fix-recording-branding-types.py
      - name: Commit generated changes
        run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/AgentBookingPortal.tsx src/Dashboard.tsx
          git diff --cached --quiet || git commit -m "Fix recording branding TypeScript"
          git push origin HEAD:main
