name: Apply Recording and Branding

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-recording-branding.py'
      - '.github/workflows/apply-recording-branding.yml'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply recording and branding changes
        run: python scripts/apply-recording-branding.py
      - name: Commit generated changes
        run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/portalUtils.ts src/AgentBookingPortal.tsx src/QCQueue.tsx src/CompanyPortal.tsx src/Dashboard.tsx src/ManagerDashboard.tsx src/LoginPage.tsx
          git diff --cached --quiet || git commit -m "Add QC recording privacy and ReadyOps branding"
          git push origin HEAD:main
