name: Apply Admin Panel Drawer
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-admin-panel-drawer.py'
      - '.github/workflows/apply-admin-panel-drawer.yml'
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert management panel to drawer
        run: python scripts/fix-admin-panel-drawer.py
      - name: Commit drawer fix
        run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/AdminPanel.tsx
          git diff --cached --quiet || git commit -m "Move ReadyOps management panel into right-side drawer"
          git push origin HEAD:main
