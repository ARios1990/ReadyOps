name: Apply QC UI Patches
on:
  push:
    branches: [feature/qc-operations]
    paths: [scripts/apply-qc-ui-patches.mjs]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qc-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-qc-ui-patches.mjs
      - run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src
          git rm scripts/apply-qc-ui-patches.mjs .github/workflows/apply-qc-ui-patches.yml
          git commit -m "Apply QC role, ReadyMode prefill, and company outcome UI"
          git push origin HEAD:feature/qc-operations
