name: Apply Ready Ops Transform

on:
  push:
    branches:
      - feature/ready-ops-form-updates
    paths:
      - scripts/apply-ready-ops-updates.mjs

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ready-ops-form-updates
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply requested updates
        run: node scripts/apply-ready-ops-updates.mjs
      - name: Commit transformed files
        run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src index.html
          git rm scripts/apply-ready-ops-updates.mjs .github/workflows/apply-ready-ops-transform.yml
          git commit -m "Rename app to Ready Ops and update lead template form"
          git push origin HEAD:feature/ready-ops-form-updates
