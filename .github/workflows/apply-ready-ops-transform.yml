name: Apply Ready Ops Transform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply requested updates
        run: node scripts/apply-ready-ops-updates.mjs
      - name: Commit transformed files
        run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src index.html
          git rm scripts/apply-ready-ops-updates.mjs .github/workflows/apply-ready-ops-transform.yml
          git commit -m "Fix Ready Ops lead template typing"
          git push origin HEAD:main
