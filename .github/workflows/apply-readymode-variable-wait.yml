name: Apply ReadyMode Variable Wait
on:
  push:
    branches: [fix/readymode-variable-wait-final4]
    paths:
      - scripts/patch-readymode-variable-wait.mjs
      - .github/workflows/apply-readymode-variable-wait.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readymode-variable-wait-final4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-readymode-variable-wait.mjs
      - run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/ReadyModeAgentTools.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Wait for ReadyMode campaign variable resolution"
            git push
          fi
