name: Apply ReadyMode Agent Tools
on:
  push:
    branches: [feature/readymode-agent-generator]
    paths:
      - scripts/apply-readymode-agent-tools.mjs
      - .github/workflows/apply-readymode-agent-tools.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/readymode-agent-generator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-readymode-agent-tools.mjs
      - run: |
          git config user.name "Masters Ready Services"
          git config user.email "mastersreadyservices2025@gmail.com"
          git add src/PortalAdmin.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate ReadyMode agent setup tools"
            git push
          fi
