name: Apply Agent Portal Link Controls

on:
  push:
    branches: [feature/agent-portal-link-controls]
    paths:
      - 'scripts/apply-agent-portal-link-controls.py'
      - 'supabase/migrations/20260818003000_manager_agent_portal_links.sql'
      - '.github/workflows/apply-agent-portal-link-controls.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/agent-portal-link-controls
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply UI patch
        run: python scripts/apply-agent-portal-link-controls.py
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit generated UI changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AdminReferenceDashboard.tsx src/ManagerDashboard.tsx
          git commit -m "Add admin and manager agent portal link controls"
          git push origin HEAD:feature/agent-portal-link-controls
