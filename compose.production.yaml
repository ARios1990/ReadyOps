name: readyops-production

services:
  readyops-web:
    image: readyops-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env.production}"
        VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in .env.production}"
    init: true
    ports:
      - "${READYOPS_BIND_ADDRESS:-127.0.0.1}:${READYOPS_PORT:-8080}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
